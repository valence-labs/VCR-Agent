[project]
name = "hooke-explain"
version = "0.1.0"
description = "Global repository for the Hooke Explain project"
readme = "README.md"
authors = [
    {name = "Recursion Pharmaceuticals", email = "devs@recursionpharma.com"},
]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "gitingest",
  "loguru>=0.7.3",
  "pandas>=2.3.1",
  "tqdm>=4.67.1",
  "cb-reach",
  "enhanced-chat-client",
  "anthropic>=0.49.0",
  "google-auth>=2.40.3",
  "langchain==0.3.26",
  "langchain-community>=0.3.27",
  "langchain-openai>=0.3.28",
  "langchain-google-vertexai>=2.0.28",
  "wikipedia>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

all = ["hooke-explain[dev]"]

[build-system]
requires = [
    "setuptools",
    "setuptools-scm", 
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"


[tool.uv]
find-links = [
    "https://data.pyg.org/whl/torch-2.6.0+cu124.html",
    "https://data.pyg.org/whl/torch-2.6.0+cpu.html",
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
pyg-lib = [
    # macOS (CPU only)
    { url = "https://data.pyg.org/whl/torch-2.6.0+cpu/pyg_lib-0.4.0+pt26-cp312-cp312-macosx_14_0_universal2.whl", marker = "sys_platform == 'darwin'" },
    # Linux GPU (CUDA 12.4)
    { url = "https://data.pyg.org/whl/torch-2.6.0+cu124/pyg_lib-0.4.0+pt26cu124-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux'"},
    # Windows CPU
    { url = "https://data.pyg.org/whl/torch-2.6.0+cpu/pyg_lib-0.4.0+pt26cpu-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32'"},
]
cb-reach = { path = "cb-reach/src", editable = true }
enhanced-chat-client = { path = "cb-reach/enhanced-chat-client", editable = true }

[tool.ruff]
# Increase line length from default 88 to 120
line-length = 120

# Target Python 3.12
target-version = "py312"

# Exclude directories from linting
exclude = [
    "cb-reach/",
    ".git/",
    "__pycache__/",
    ".venv/",
    "*.egg-info/",
]

[tool.ruff.lint]
# Enable a subset of rules - being less stringent
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings  
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming (but we'll ignore some)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (but we'll ignore some)
]

# Ignore some stringent rules
ignore = [
    "E501",   # Line too long (we set line-length to 120 anyway)
    "E731",   # Do not assign a lambda expression, use a def
    "N806",   # Variable in function should be lowercase (allows camelCase)
    "N803",   # Argument name should be lowercase (allows camelCase)
    "N802",   # Function name should be lowercase (allows camelCase)
    "B008",   # Do not perform function calls in argument defaults
    "B006",   # Do not use mutable data structures for argument defaults
]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing comma
skip-magic-trailing-comma = false

[dependency-groups]
dev = [
    "ipykernel>=6.30.0",
]

[tool.ruff.lint.isort]
# Fix package name consistency
known-first-party = ["explain"]
